  </defs>

  <rect width="1600" height="680" fill="url(#bg)"/>

  <text x="800" y="48" text-anchor="middle" font-size="29" font-weight="700" fill="#173A5E">NSRE-Guided Omics Imaging and Multi-Omics Fusion</text>
  <text x="800" y="80" text-anchor="middle" font-size="17" fill="#5E6E83">基于 NSRE 引导组学图像化与多组学融合的乳腺癌分子分型及生存预测 · 方法概念图</text>

  <!-- Node 1 -->
  <g>
    <rect x="60" y="128" width="220" height="320" rx="18" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.5" filter="url(#shadow)"/>
