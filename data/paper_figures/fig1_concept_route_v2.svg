    <text x="170" y="356" text-anchor="middle" font-size="13" fill="#5E6E83">TCGA-BRCA</text>
    <text x="170" y="380" text-anchor="middle" font-size="13" fill="#5E6E83">mRNA / CNV / miRNA</text>
  </g>

  <path d="M290 288 L320 288" stroke="#7D9CB7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

