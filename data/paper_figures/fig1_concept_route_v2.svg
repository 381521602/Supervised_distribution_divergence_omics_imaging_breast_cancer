    <text x="1290" y="380" text-anchor="middle" font-size="13" fill="#5E6E83">FullSizeCNN</text>
  </g>

  <path d="M1410 288 L1440 288" stroke="#7D9CB7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

