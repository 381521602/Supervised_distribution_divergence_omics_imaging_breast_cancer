  <g>
    <rect x="1460" y="128" width="80" height="320" rx="18" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="1460" y="128" width="80" height="10" rx="5" fill="#D86C6C"/>
    <circle cx="1500" cy="170" r="21" fill="#FAE8E8" stroke="#D86C6C" stroke-width="2"/>
