    <circle cx="1218" cy="170" r="21" fill="#FDF1E2" stroke="#F2A45A" stroke-width="2"/>
    <text x="1218" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#F2A45A">5</text>
    <g transform="translate(1290 226)" fill="none" stroke="#D18A42" stroke-width="3">
      <circle cx="-28" cy="-18" r="7" fill="#F9D8AE"/>
      <circle cx="-28" cy="18" r="7" fill="#F9D8AE"/>
      <circle cx="24" cy="-18" r="7" fill="#F9D8AE"/>
      <circle cx="24" cy="18" r="7" fill="#F9D8AE"/>
      <circle cx="34" cy="0" r="7" fill="#F9D8AE"/>
      <path d="M-21 -18 L17 -18 M-21 18 L17 18 M-28 -11 L-28 11 M24 -11 L24 11 M31 -18 L-18 11 M31 18 L-18 -11"/>
