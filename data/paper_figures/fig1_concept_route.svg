<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1E3A5F" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFD"/>
      <stop offset="1" stop-color="#EEF4F8"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="920" fill="url(#bg)"/>

  <text x="700" y="62" text-anchor="middle" font-size="31" font-weight="700" fill="#173A5E">NSRE-Guided Omics Imaging and Multi-Omics Fusion</text>
  <text x="700" y="98" text-anchor="middle" font-size="20" fill="#5E6E83">基于 NSRE 引导组学图像化与多组学融合的乳腺癌分子分型及生存预测 · 方法概念图</text>

  <!-- Node card 1 -->
  <g>
    <rect x="70" y="150" width="360" height="250" rx="20" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="70" y="150" width="360" height="14" rx="7" fill="#2E6FA6"/>
    <circle cx="112" cy="205" r="25" fill="#E8F1F8" stroke="#2E6FA6" stroke-width="2"/>
    <text x="112" y="213" text-anchor="middle" font-size="20" font-weight="700" fill="#2E6FA6">1</text>
    <path d="M260 210 h18 M253 190 h32 M260 228 h18" stroke="#2E6FA6" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M248 176 h42 v20 h-42 z M248 202 h42 v20 h-42 z" fill="#7FB0D1" opacity="0.92"/>
    <text x="250" y="288" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A5F">数据获取与样本对齐</text>
    <text x="250" y="322" text-anchor="middle" font-size="15" fill="#5E6E83">TCGA-BRCA · mRNA / CNV / miRNA</text>
    <text x="250" y="348" text-anchor="middle" font-size="15" fill="#5E6E83">统一交集样本清单</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M438 275 L482 275" stroke="#8BA9C2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Node card 2 -->
  <g>
    <rect x="520" y="150" width="360" height="250" rx="20" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="520" y="150" width="360" height="14" rx="7" fill="#348FB3"/>
    <circle cx="562" cy="205" r="25" fill="#E9F4F7" stroke="#348FB3" stroke-width="2"/>
    <text x="562" y="213" text-anchor="middle" font-size="20" font-weight="700" fill="#348FB3">2</text>
    <path d="M672 183 L722 183 L722 230 L672 230 Z" fill="#F4C78E" stroke="#C4874A" stroke-width="2"/>
    <circle cx="685" cy="206" r="5" fill="#A96832"/>
    <path d="M707 194 h15 M707 204 h15 M707 214 h15" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round"/>
    <text x="700" y="288" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A5F">临床标签定义</text>
    <text x="700" y="322" text-anchor="middle" font-size="15" fill="#5E6E83">PAM50 四分类</text>
    <text x="700" y="348" text-anchor="middle" font-size="15" fill="#5E6E83">总生存 / 事件 / 删失时间</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M888 275 L932 275" stroke="#8BA9C2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Node card 3 -->
  <g>
    <rect x="970" y="150" width="360" height="250" rx="20" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="970" y="150" width="360" height="14" rx="7" fill="#60A5C7"/>
    <circle cx="1012" cy="205" r="25" fill="#EAF4F8" stroke="#60A5C7" stroke-width="2"/>
    <text x="1012" y="213" text-anchor="middle" font-size="20" font-weight="700" fill="#60A5C7">3</text>
    <path d="M1100 220 L1150 188 L1150 252 Z" fill="#7FB0D1" stroke="#4C84A0" stroke-width="2"/>
    <path d="M1128 205 h25 M1128 220 h32 M1128 235 h20" stroke="#2E6FA6" stroke-width="5" stroke-linecap="round"/>
    <text x="1150" y="288" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A5F">无泄漏特征筛选</text>
    <text x="1150" y="322" text-anchor="middle" font-size="15" fill="#5E6E83">低方差 / F / L1 / NSRE</text>
    <text x="1150" y="348" text-anchor="middle" font-size="15" fill="#5E6E83">组合与数量扩增</text>
  </g>

  <!-- Snake connector from 3 to 4 -->
  <path d="M1150 400 L1150 510 L250 510 L250 560" fill="none" stroke="#8BA9C2" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Node card 4 -->
  <g>
    <rect x="70" y="560" width="360" height="250" rx="20" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="70" y="560" width="360" height="14" rx="7" fill="#81BBC8"/>
    <circle cx="112" cy="615" r="25" fill="#EAF4F5" stroke="#81BBC8" stroke-width="2"/>
    <text x="112" y="623" text-anchor="middle" font-size="20" font-weight="700" fill="#81BBC8">4</text>
    <rect x="198" y="588" width="104" height="80" rx="12" fill="#EDF6F7" stroke="#81BBC8" stroke-width="2"/>
    <path d="M210 628 C225 618 235 640 250 628 S270 618 282 628" fill="none" stroke="#4C84A0" stroke-width="4" stroke-linecap="round"/>
    <path d="M222 646 h56" stroke="#4C84A0" stroke-width="2"/>
    <text x="250" y="698" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A5F">NSRE 组学图像化</text>
    <text x="250" y="732" text-anchor="middle" font-size="15" fill="#5E6E83">重要性降序 + 中心螺旋填充</text>
    <text x="250" y="758" text-anchor="middle" font-size="15" fill="#5E6E83">灰度 / 功能 / NSRE 特征图</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M438 685 L482 685" stroke="#8BA9C2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Node card 5 -->
  <g>
    <rect x="520" y="560" width="360" height="250" rx="20" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="520" y="560" width="360" height="14" rx="7" fill="#F2A45A"/>
    <circle cx="562" cy="615" r="25" fill="#FDF1E2" stroke="#F2A45A" stroke-width="2"/>
    <text x="562" y="623" text-anchor="middle" font-size="20" font-weight="700" fill="#F2A45A">5</text>
    <g fill="none" stroke="#D18A42" stroke-width="3">
      <circle cx="668" cy="606" r="9" fill="#F9D8AE"/>
      <circle cx="668" cy="646" r="9" fill="#F9D8AE"/>
      <circle cx="714" cy="626" r="9" fill="#F9D8AE"/>
      <circle cx="738" cy="626" r="9" fill="#F9D8AE"/>
      <path d="M677 606 L705 626 M677 646 L705 626 M723 626 L729 626"/>
    </g>
    <text x="700" y="698" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A5F">单组学建模</text>
    <text x="700" y="732" text-anchor="middle" font-size="15" fill="#5E6E83">LR / RF / GBM / SVC / KNN</text>
    <text x="700" y="758" text-anchor="middle" font-size="15" fill="#5E6E83">MLP · FullSizeCNN</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M888 685 L932 685" stroke="#8BA9C2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Node card 6 -->
  <g>
    <rect x="970" y="560" width="360" height="250" rx="20" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="970" y="560" width="360" height="14" rx="7" fill="#D86C6C"/>
    <circle cx="1012" cy="615" r="25" fill="#FAE8E8" stroke="#D86C6C" stroke-width="2"/>
    <text x="1012" y="623" text-anchor="middle" font-size="20" font-weight="700" fill="#D86C6C">6</text>
    <path d="M1090 626 L1115 600 L1115 652 Z" fill="#E39A9A" opacity="0.9"/>
    <path d="M1120 626 h36" stroke="#C86A6A" stroke-width="4"/>
    <path d="M1180 598 v56" stroke="#C86A6A" stroke-width="4"/>
    <text x="1150" y="698" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A5F">多组学融合与评估</text>
    <text x="1150" y="732" text-anchor="middle" font-size="15" fill="#5E6E83">拼接 / 注意力 / Stacking</text>
    <text x="1150" y="758" text-anchor="middle" font-size="15" fill="#5E6E83">5 折 CV · Acc / AUC / C-index</text>
  </g>

  <!-- Footer -->
  <rect x="520" y="846" width="360" height="42" rx="21" fill="#FBF0F0" stroke="#D9A3A3"/>
  <text x="700" y="874" text-anchor="middle" font-size="17" font-weight="700" fill="#A23E3E">下游可解释性：SHAP · Grad-CAM</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8BA9C2"/>
    </marker>
  </defs>
</svg>
